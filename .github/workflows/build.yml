name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version name
        id: version
        run: |
          VERSION_NAME=$(git describe --tags --always --dirty)
          echo "Resolved version name: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Test extractor (host)
        working-directory: tools/extract_rs
        run: cargo test --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Decode Android signing key
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          export VERSION_NAME="${{ steps.version.outputs.version_name }}"
          ./gradlew :app:assembleRelease --no-daemon -PversionName="$VERSION_NAME"

      - name: Rename Release APK
        run: mv app/build/outputs/apk/release/*.apk "GhostLock-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-${{ steps.version.outputs.version_name }}
          path: GhostLock-${{ steps.version.outputs.version_name }}.apk
          archive: false

  release:
    name: Publish Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "GhostLock-*"
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.build-apk.outputs.version_name }}-${{ github.run_number }}"
          name: "GhostLock ${{ needs.build-apk.outputs.version_name }}-${{ github.run_number }}"
          body: "Automated build from commit ${{ github.sha }}."
          make_latest: true
          files: artifacts/*.apk
